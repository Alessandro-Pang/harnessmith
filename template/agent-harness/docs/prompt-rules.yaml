version: 1
rules:
  - id: user-task-read-only
    owner: operating-model
    principle: Read-only requests do not mutate the user task object.
    rationale: Analysis or diagnosis must not silently become source, configuration, documentation, or remote writes.
    action: Inspect and report evidence without modifying the scoped user object.
    fallback: Return an evidence-bounded answer or inconclusive result.
    guarantee: guided
    enforcedBy: agent
    boundary:
      - template/AGENTS.md
      - template/agent-harness/docs/core/operating-model.md
    confusingWith: [sidecar-write-eligibility]

  - id: sidecar-write-eligibility
    owner: project-agent-docs
    principle: User-object read-only status does not decide managed sidecar eligibility.
    rationale: Combining the two dimensions either loses qualified findings or authorizes unrelated writes.
    action: Run the unified negative-first eligibility evaluator, then evaluate value, source evidence, typed writer, authorization, and root state independently.
    fallback: Return a proposal or blocked result without editing managed Markdown.
    guarantee: guided
    enforcedBy: agent
    boundary:
      - template/agent-harness/docs/standards/project-agent-docs.md
      - packages/harness/src/lib/memory/memory-capture-eligibility.ts
    confusingWith: [user-task-read-only]

  - id: turn-end-memory-checkpoint
    owner: project-agent-docs
    principle: Every user turn gets one bounded capture decision before delivery.
    rationale: Typed writers cannot help when the Agent never evaluates high-value constraints, findings, experience, or unfinished work.
    action: Run capture eligibility, use the matching typed writer, and verify the result before the final response; keep low-value or unsafe candidates proposed or blocked.
    fallback: Preserve an auditable proposal or inconclusive payload for the next turn without claiming automatic persistence.
    guarantee: guided
    enforcedBy: agent
    boundary:
      - template/agent-harness/docs/core/execution-loop.md
      - template/agent-harness/docs/standards/project-agent-docs.md

  - id: managed-work-state-write-path
    owner: harness-cli-architecture
    principle: Managed Memory, Task, and Handoff writes use typed runtime paths.
    rationale: Direct command-level filesystem mutation bypasses validation, locking, atomicity, and rollback.
    action: Route mutations through the owning store or transaction.
    fallback: Fail closed and preserve a recoverable path.
    guarantee: enforced
    enforcedBy: runtime
    evidence:
      implementation:
        - scripts/preflight/preflight-architecture.ts
        - packages/harness/src/lib/memory/memory-write.ts
        - packages/harness/src/lib/task/task-store.ts
      verification:
        - packages/cli/src/__tests__/preflight-architecture.test.ts
        - packages/harness/src/__tests__/memory-write-safety.test.ts
        - packages/harness/src/__tests__/memory-handoff-safety.test.ts

  - id: task-completion-gate
    owner: long-running-tasks
    principle: Task complete requires current passing acceptance evidence.
    rationale: A completion summary or curation result does not prove the acceptance criteria.
    action: Call the acceptance gate before persisting complete.
    fallback: Keep the task in progress or close it as blocked with an actionable next step.
    guarantee: enforced
    enforcedBy: runtime
    evidence:
      implementation:
        - packages/harness/src/commands/task/task.ts
        - packages/harness/src/lib/task/task-evidence.ts
      verification:
        - packages/cli/src/__tests__/preflight-architecture.test.ts
        - packages/harness/src/__tests__/task-evidence.test.ts
        - packages/harness/src/__tests__/task-core-safety.test.ts
    confusingWith: [completion-curation]

  - id: completion-curation
    owner: project-agent-docs
    principle: Completion curation proposes Memory lifecycle actions without completing a Task.
    rationale: Semantic retention and mechanical acceptance answer different questions.
    action: Produce bounded promote, close, supersede, archive, or skip candidates for the current task scope.
    fallback: Return none and leave Task and Memory unchanged.
    guarantee: enforced
    enforcedBy: runtime
    evidence:
      implementation:
        - packages/harness/src/commands/memory/memory-curation.ts
        - packages/harness/src/lib/memory/memory-curation-documents.ts
      verification:
        - packages/harness/src/__tests__/memory-curation.test.ts
        - packages/harness/src/__tests__/task-core-safety.test.ts
    confusingWith: [task-completion-gate]

  - id: action-intent-routing
    owner: operating-model
    principle: Primary playbooks match requested actions while topics match involved concepts.
    rationale: Examples, quotations, and historical descriptions can contain action words without requesting those actions.
    action: Preserve the raw request and return no primary playbook when no action intent matches.
    fallback: Return explicit ambiguity instead of selecting by keyword priority.
    guarantee: enforced
    enforcedBy: runtime
    evidence:
      implementation:
        - packages/harness/src/lib/documentation/docs-routing.ts
        - packages/harness/src/lib/documentation/docs-routing-matching.ts
      verification:
      - packages/harness/src/__tests__/docs-routing.test.ts

  - id: execution-loop-guidance
    owner: operating-model
    principle: Non-trivial tasks advance through explicit framing, observation, action, verification, and delivery states.
    rationale: A checklist without intermediate outputs lets the Agent skip evidence collection, continue after changed conditions, or report an unverified result.
    action: Keep one current claim, one next action, expected evidence, and stop condition; after each tool or verifier result, update the next action.
    fallback: Stop at the current state and report blocked or inconclusive when the next action, evidence, or authorization is unclear.
    guarantee: guided
    enforcedBy: agent
    boundary:
      - template/agent-harness/docs/core/execution-loop.md
      - template/agent-harness/docs/references/prompt-examples.md

  - id: host-approval-continuation
    owner: tool-routing
    principle: Authorization blockers use an available host interaction path before the Agent stops.
    rationale: A prompt that forbids an action without requesting a one-shot decision leaves interactive Hosts waiting for a new chat turn.
    action: Complete non-blocked work, call an explicitly advertised host approval or question capability, and continue only the exact action permitted by its result.
    fallback: Keep the task blocked with a concrete nextAction when the capability is absent or returns denied, cancelled, or timeout; never treat the result as future authorization.
    guarantee: host-dependent
    enforcedBy: host
    boundary:
      - template/agent-harness/docs/core/tool-routing.md
      - apps/docs/site/zh/concepts/boundaries.md

  - id: reasoning-mode-output-contract
    owner: operating-model
    principle: An activated reasoning mode changes observable work products, not just internal vocabulary.
    rationale: Naming a theory does not make the Agent use it; without required artifacts and stop conditions the mode is easy to ignore.
    action: Read the selected mode section and produce its required artifacts when the route reports an explicit or inferred activation.
    fallback: Do not force a mode for a simple task; if activation evidence is insufficient, follow the Playbook and ordinary verification contract.
    guarantee: guided
    enforcedBy: agent
    boundary:
      - template/agent-harness/docs/references/reasoning-modes.md
      - packages/harness/src/lib/documentation/docs-routing.ts

  - id: pre-execution-judgment
    owner: operating-model
    principle: A user-prescribed implementation means is not automatically the task goal.
    rationale: Blindly executing a complex means can increase cost and risk even when a simpler sufficient solution exists.
    action: Separate goal, proposed means, hard constraints, and unverified premises; compare a minimum-sufficient alternative and raise constructive dissent only when the mismatch is significant.
    fallback: Respect low-impact preferences and explicitly confirmed constraints; when a material choice remains open, stop with a concrete recommendation and confirmation-needed instead of implementing silently.
    guarantee: guided
    enforcedBy: agent
    boundary:
      - template/agent-harness/docs/references/reasoning-modes.md
      - template/agent-harness/docs/playbooks/change.md
      - template/agent-harness/docs/playbooks/research-and-design.md

  - id: multilingual-routing-and-response
    owner: operating-model
    principle: Runtime resolves action intent and response-language precedence; the Agent uses that decision for the final response.
    rationale: Translation targets, quotations, and English keyword overlap are not durable preferences or requested actions.
    action: Match action and concept aliases separately, then resolve current explicit language before persisted evidence and detection; follow the returned decision for the response.
    fallback: Return unmatched, ambiguous, or undetermined without guessing or mutating the user profile.
    guarantee: guided
    enforcedBy: agent
    boundary:
      - template/agent-harness/docs/core/operating-model.md
      - apps/docs/site/zh/concepts/boundaries.md
    evidence:
      implementation:
        - packages/harness/src/lib/documentation/docs-routing.ts
        - packages/harness/src/lib/routing/response-language.ts
        - template/agent-harness/docs/manifest.yaml
      verification:
        - packages/harness/src/__tests__/docs-routing.test.ts
        - packages/cli/src/__tests__/multilingual-prompt.test.ts
        - evals/__tests__/prompt-route-benchmark.test.ts

  - id: payload-consumption-boundary
    owner: harness-cli-architecture
    principle: Typed payloads are consumed only after the owning domain command succeeds.
    rationale: Early deletion loses recovery evidence while replaying mutable payloads can duplicate or change mutations.
    action: Validate identity and content, execute once, then remove a successful one-shot payload.
    fallback: Preserve or replace the failed payload using the documented retry contract.
    guarantee: enforced
    enforcedBy: runtime
    evidence:
      implementation:
        - packages/harness/src/cli.ts
        - packages/harness/src/lib/filesystem/command-payload.ts
      verification:
        - packages/harness/src/__tests__/memory-payload-file.test.ts

  - id: host-event-delivery
    owner: observability
    principle: Host lifecycle events exist only when a supported Host integration emits them.
    rationale: A receiver, Prompt reminder, mock, or scenario definition does not prove real event delivery.
    action: Verify the official Host contract and candidate-bound event evidence.
    fallback: Report unsupported, not configured, or inconclusive without inventing an event.
    guarantee: host-dependent
    enforcedBy: host
    boundary:
      - apps/docs/site/zh/concepts/architecture.md
      - template/agent-harness/docs/core/observability.md

  - id: host-signal-replay-proof
    owner: long-running-tasks
    principle: Duplicate host signals do not authorize duplicate mutations.
    rationale: Missing stdout and repeated delivery require exact payload and persisted-state proof.
    action: Verify new mutation or identical replay evidence with the read-only replay state machine.
    fallback: Return inconclusive and require a new payload after failed or incomplete attempts.
    guarantee: enforced
    enforcedBy: runtime
    evidence:
      implementation:
        - packages/harness/src/lib/replay/replay-contract.ts
        - packages/harness/src/commands/replay/replay.ts
      verification:
        - packages/harness/src/__tests__/replay-contract.test.ts
        - packages/harness/src/__tests__/host-signal-replay.test.ts
