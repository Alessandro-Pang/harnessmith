name: Publish npm package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.6.2
      - name: Verify signed tag and main ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_object=$(git rev-parse "${GITHUB_REF_NAME}^{tag}")
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.verification.verified')" = true
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run release:quality
      - name: Rebuild and verify the attested candidate
        run: |
          mkdir .release-ci
          npm pack --json --ignore-scripts --pack-destination .release-ci
          node --import tsx scripts/release/release-version.ts ci-verify --artifact .release-ci/harnessmith-*.tgz --tag "${GITHUB_REF_NAME}"
      - name: Publish through npm Trusted Publishing
        env:
          HARNESS_RELEASE_WORKFLOW: '1'
        run: npm publish .release-ci/harnessmith-*.tgz --access public --registry=https://registry.npmjs.org/
      - name: Verify npm registry package
        run: >-
          node --import tsx scripts/release/registry-verify.ts
          --package harnessmith
          --version "${GITHUB_REF_NAME#v}"
          --expected-artifact .release-ci/harnessmith-*.tgz
          --evidence-file .release-ci/registry-verification.json
          --require-provenance
          --json
      - name: Upload registry verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: registry-verification-${{ github.ref_name }}
          path: .release-ci/registry-verification.json
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create generated release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --fail-on-no-commits
          --title "${GITHUB_REF_NAME}"
